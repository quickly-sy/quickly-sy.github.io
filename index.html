<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet" />
    <title>Quickly</title>
    <style>
      body { margin: 0; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; background: #eef2f0; color: #17201c; }
      main { max-width: 640px; margin: 10vh auto; padding: 24px; }
      h1 { font-size: 44px; margin: 0 0 6px; color: #d9480f; }
      p { color: #66716c; margin: 0 0 28px; }
      a { display: flex; justify-content: space-between; padding: 18px 20px; margin-bottom: 10px; background: #fff;
          border: 1px solid #dde3e0; border-inline-start: 6px solid var(--c); border-radius: 10px; color: inherit; text-decoration: none; font-weight: 600; }
      a:hover { border-color: var(--c); }
      small { color: #66716c; font-weight: 400; }
    </style>
  </head>
  <body>
    <main>
      <h1>Quickly</h1>
      <p>اختر الواجهة</p>
      <a href="./customer/" style="--c:#d9480f">اطلب الآن <small>للزبائن</small></a>
      <a href="./vendor/" style="--c:#6d28d9">لوحة المتجر <small>لأصحاب المتاجر</small></a>
      <a href="./driver/" style="--c:#0f766e">تطبيق السائق <small>للسائقين</small></a>
      <a href="./admin/" style="--c:#1e3a8a">الإدارة <small>لفريق Quickly</small></a>
    </main>
  </body>
</html>
